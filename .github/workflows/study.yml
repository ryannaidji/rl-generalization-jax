name: study
# Runs the full Part A study on a free CPU runner and commits the JSON results.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=src:. python -m experiments.run_study
      - run: PYTHONPATH=src:. python -m experiments.plot
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add results report/figures
          git commit -m "Study results from run ${{ github.run_id }}" || echo "nothing to commit"
          git pull --rebase origin main
          git push
